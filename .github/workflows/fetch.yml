name: fetch results

on:
  schedule:
    # Raz w miesiącu: 1. dnia o 05:00 UTC (6:00/7:00 w Polsce) – dane za poprzedni miesiąc i typy na nowy.
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch.mjs
      - name: Commit new draws
        run: |
          # Bez commitów w dni robocze 8:00-16:00 czasu polskiego.
          if [ "$(TZ=Europe/Warsaw date +%u)" -le 5 ] && [ "$(TZ=Europe/Warsaw date +%H)" -ge 8 ] && [ "$(TZ=Europe/Warsaw date +%H)" -lt 16 ]; then
            echo "Working hours in Poland, skipping commit"
            exit 0
          fi
          git add data
          if git diff --cached --quiet; then
            echo "No new draws"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update draw results"
          git push
